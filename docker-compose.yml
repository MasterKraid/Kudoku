services:
  tsundoku:
    build: .
    image: tsundoku:local
    container_name: tsundoku
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - tsundoku-data:/data
      - ${DOWNLOADS_PATH:-tsundoku-downloads}:/data/downloads
      - ./webui/build:/opt/tsundoku/webUI:ro
    environment:
      - TZ=Etc/UTC
      - BIND_IP=127.0.0.1
      - BIND_PORT=4567
      - DATABASE=external
      - DATABASE_URL=postgresql://127.0.0.1:5432/tsundoku
      - DATABASE_USERNAME=tsundoku
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - FLARESOLVERR_ENABLED=true
      - FLARESOLVERR_URL=http://127.0.0.1:8191
    deploy:
      resources:
        limits:
          cpus: '5.6'
          memory: 9G
    depends_on:
      - flaresolverr

  flaresolverr:
    build:
      context: /srv/http/flaresolverr
      dockerfile: Dockerfile
    image: flaresolverr:local
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FILE=${LOG_FILE:-none}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=Etc/UTC
    ports:
      - "127.0.0.1:8191:8191"

volumes:
  tsundoku-data:
  tsundoku-downloads:
